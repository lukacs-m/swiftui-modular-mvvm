name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Select Xcode via the standard action rather than a hardcoded path, which
      # breaks whenever the runner image rotates its installed Xcodes. The version
      # is a range so a patch bump (26.4.0 → 26.4.1) doesn't fail the build; widen
      # to '26' or 'latest-stable' if you want to always track the newest.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Show versions
        run: |
          swift --version
          xcodebuild -version

      - name: Install build and style tools
        run: brew install xcodegen swiftformat swiftlint

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

      - name: Generate Xcode project
        run: make generate

      - name: Check architecture and dependency pins
        run: make check-architecture check-locks

      - name: Check generated file templates
        run: make test-templates

      - name: Check fresh-project workflow
        run: make test-scaffold

      - name: Test modules
        run: make test

      - name: Build app
        run: make build

      - name: Test on iOS Simulator
        run: make test-app

